name: Збірка під Windows

# .exe збирається тільки на Windows: PyInstaller не вміє крос-компіляцію,
# тому з мака ця збірка не запускається принципово.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyinstaller pywebview

      - name: Зібрати LUT Grab.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "LUT Grab"
          --icon icon.ico
          --add-data "ui.html;."
          --collect-all webview
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: LUT-Grab-Windows
          path: dist/LUT Grab.exe

      # Тег є - значить це реліз, і .exe має лягти поруч із DMG.
      - name: Додати до релізу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LUT Grab.exe
